<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>task1</title>
</head>

<body>
    <div class="container">
        <div class="scale-elment">
            <div id="animateBox" class="box"></div>
        </div>
    </div>

    <div class="controls">
        <button id="play">Play</button>
        <button id="pause">Pause</button>
        <button id="stop">Reset</button>
    </div>

    <script>

        const box = document.getElementById('animateBox');
        const play = document.getElementById('play');
        const pause = document.getElementById('pause');
        const stop = document.getElementById('stop');

        play.addEventListener('click', playAnim)
        pause.addEventListener('click', pauseAnim)
        stop.addEventListener('click', stopAnim)

        function playAnim() {
            box.classList.add('is-playing');
        }

        function pauseAnim() {
            box.classList.remove('is-playing');
        }

        function stopAnim() {
            box.classList.remove('is-playing');

            box.style.animation = 'none';

            void box.offsetWidth;

            box.style.animation = 'slideIn 4s ease-in-out 0.5s infinite';
        }
    </script>
</body>

</html>
