<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>drag and drob</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 100px;
        }

        .left, .right {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;

            border: 1px solid tomato;

            width: 40%;
            height: 80lvh;
        }

        img {
            transition: all 0.4s ease-in-out;
        }

        img:hover {
            filter: drop-shadow(5px 5px 10px rgba(0, 0, 0, 0.5));
        }
        #refresh {
            position: absolute;
            z-index: 10;
            top: 20px;
            left: 20px;
            background-color: aquamarine;
            padding: 10px;
            border: none;
            border-radius: 6px;
            transition: all .4s ease-in-out;
            cursor: pointer;
        }

        #refresh:hover {
            background-color: tomato;
        }

    </style>
</head>

<body>
    <!-- drag and drop api task -->
     <button id="refresh">Reset</button>

    <main>
        <section class="left" id="left"></section>
        <section class="right" id="right">
            <img width="200px" src="../assets/img1.jpg" alt="img 1">
            <img width="200px" src="../assets/img2.webp" alt="img 2">
            <img width="200px" src="../assets/img3.webp" alt="img 3">
            <img width="200px" src="../assets/img4.png" alt="img 4">
            <img width="200px" src="../assets/img5.png" alt="img 5">
            <img width="200px" src="../assets/img6.jpeg" alt="img 6">
        </section>
    </main>

    <script src="./drag.js" defer></script>
</body>

</html>
