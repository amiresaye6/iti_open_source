<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task 1</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f5;
        }

        .container {
            display: flex;
            width: 90%;
            height: 85vh;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            gap: 20px;
        }

        .sidebar {
            width: 25%;
            height: 100%;
            padding: 10px;
            overflow-y: auto;
            background-color: #f9f9f9;
            display: flex;
            flex-direction: column;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .button {
            margin: 5px 0;
            padding: 12px;
            width: 100%;
            text-align: left;
            background-color: #eee;
            color: #333;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .button:hover {
            background-color: #e0e0e0;
        }

        .active {
            background-color: #007bff;
            color: white;
            font-weight: bold;
            transform: none;
        }

        .mainSection {
            width: 75%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            cursor: pointer;
            object-fit: contain;
        }

        video:hover {
            transform: none;
        }
        .nyt {
            position: absolute;
            top: 0;
            right: 5px;
            padding: 5px 10px;
            background-color: red;
            color: white;
            border-radius: 10px;
            z-index: 10;
        }
    </style>
</head>

<body>
    <h3 class="nyt">notYoutube</h3>
    <div class="container">
        <div class="sidebar">
            <!-- added by js -->
        </div>
        <div class="mainSection">
            <video id="videoPlayer">
                <source id="videoSource" src="../assets/video/test.mp4" type="video/mp4">
            </video>
        </div>
    </div>

    <script src="./ytclone.js"></script>
</body>

</html>
