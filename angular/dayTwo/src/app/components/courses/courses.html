<header class="w-full p-4 shadow-sm flex justify-between items-center px-4">
    <div class="logo flex justify-center items-center gap-2">
        <img src="./icons/school.png" alt="school logo" class="w-8">
        <h1 class="text-indigo-600 font-bold text-3xl">My Courses</h1>
    </div>
    <div>
        <select (change)="filterByCategory($event)" name="categories" id="categories"
            class="py-1 px-2 rounded-lg border-2 shadow-sm border-indigo-600 ">
            @for(category of categories; track category) {
            <option [value]="category">{{category}}</option>
            }
        </select>
    </div>
</header>

<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
    @for(c of filteredCourses; track c.id) {
    <div class="card relative p-4 m-4 rounded-2xl shadow-sm border-slate-200">
        <div class="img">
            <img class="object-fill rounded-lg" [src]="c.image" alt="">
        </div>
        <span
            class=" absolute px-2 py-0.5 m-2 rounded-lg top-0 right-0 bg-slate-900/60 text-white font-bold text-[10px] ">{{c.price}}
            $</span>
        <h1 class="title text-slate-900">{{c.title}}</h1>
        <div class="flex gap-2 items-center">
            <img src="./icons/school.png" class="w-5" alt="seat image">
            <h1 class="instructor text-indigo-600">{{c.instructor}}</h1>
        </div>
        <div class="flex justify-between items-center">
            <div class="flex gap-2 items-center">
                <img src="./icons/office-chair.png" class="w-5" alt="seat image">
                <h1 class="font-bold"
                    [class]="c.seats === 0 ? 'text-red-400' : c.seats <= 2 ? 'text-yellow-400' : 'text-emerald-500'">
                    {{c.seats}}</h1>
            </div>
            @if(c.seats <= 2 && c.seats !=0) { <h1 class="py-1 px-2 rounded-lg bg-yellow-400 text-white">Almost full
                </h1>
                }
                @if(c.seats === 0){
                <h1 class="py-1 px-2 rounded-lg bg-red-400 text-white">Fully Booked</h1>
                }
                <button (click)="bookSeat(c.id)" [disabled]="'booked' in c"
                    [class]="'booked' in c ? 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200' : 'bg-indigo-600 hover:bg-indigo-700 text-white'"
                    class=" py-1 px-2 rounded-lg ">
                    {{ 'booked' in c ? "Booked" : "Book now" }}
                </button>
        </div>
    </div>
    }
</div>
