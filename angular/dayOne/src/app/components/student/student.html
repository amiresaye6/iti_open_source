<div class="bg-gray-50 min-h-screen p-6">
    <div class="max-w-7xl mx-auto">
        <h1 class="text-2xl font-bold mb-8 pb-2 inline-block">
            Students
        </h1>

        <div class="grid  xl:grid-cols-4 gap-6">

            @for (student of students; track student) {
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 ">

                <div class="flex flex-col items-center">
                    <div class="relative mb-4">
                        <img src="{{student.photoUrl}}" alt="{{student.name}}"
                            class="w-24 h-24 rounded-full object-cover ring-4 ring-blue-50 ">
                    </div>

                    <div class="text-center">
                        <h2 class="text-lg font-bold">
                            {{ student.name }}
                        </h2>
                        <span class="text-xs font-mono text-gray-400 bg-gray-50 px-2 py-1 rounded">
                            ID: {{ student.id }}
                        </span>
                    </div>

                    <div class="w-full h-px bg-gray-100 my-4"></div>

                    <div class="flex justify-between w-full px-4 text-sm">
                        <span class="text-gray-500">Age</span>
                        <span class="font-semibold">{{ student.age }} years</span>
                    </div>

                </div>

            </div>
            }

        </div>
    </div>
</div>
